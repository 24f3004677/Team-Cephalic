{% extends "base.html" %}
{% block title %}Send Alert{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-white fw-bold">
                <i class="fas fa-exclamation-triangle me-2 text-danger"></i>Send Alert
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('main.send_alert') }}">
                	<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label d-block">Target Type</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="target_type" id="type_node" value="node" checked>
                            <label class="form-check-label" for="type_node"><i class="fas fa-microchip me-1"></i>Node</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="target_type" id="type_mine" value="mine">
                            <label class="form-check-label" for="type_mine"><i class="fas fa-mine me-1"></i>Mine (all nodes)</label>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="node_id" class="form-label">Select Node</label>
                            <select class="form-select" id="node_id" name="node_id">
                                <option value="">-- Choose --</option>
                                {% for node in nodes %}
                                <option value="{{ node.id }}">{{ node.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="mine_id" class="form-label">Select Mine</label>
                            <select class="form-select" id="mine_id" name="mine_id">
                                <option value="">-- Choose --</option>
                                {% for mine in mines %}
                                <option value="{{ mine.id }}">{{ mine.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" name="message" rows="4" placeholder="Describe the alert reason..."></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger"><i class="fas fa-paper-plane"></i> Send Alert</button>
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
