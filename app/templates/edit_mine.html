{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Edit Mine</h2>
    <form method="POST">
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" class="form-control" value="{{ mine.name }}" required>
        </div>
        <div class="form-group">
            <label>Location</label>
            <input type="text" name="location" class="form-control" value="{{ mine.location }}">
        </div>
        <div class="form-group">
            <label>Workers Count</label>
            <input type="number" name="workers_count" class="form-control" value="{{ mine.workers_count }}" min="0">
        </div>
        <div class="form-group">
            <label>X Position (0-100)</label>
            <input type="number" name="x" class="form-control" min="0" max="100" step="0.1" value="{{ mine.x }}">
        </div>
        <div class="form-group">
            <label>Y Position (0-100)</label>
            <input type="number" name="y" class="form-control" min="0" max="100" step="0.1" value="{{ mine.y }}">
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{{ url_for('admin.list_links') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
