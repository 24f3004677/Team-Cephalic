{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="fas fa-link me-2 text-primary"></i>Existing Node Links</h2>
    <a href="{{ url_for('admin.create_link') }}" class="btn btn-primary">
        <i class="fas fa-plus-circle"></i> Create New Link
    </a>
</div>

<div class="table-responsive">
    <table class="table table-hover align-middle">
        <thead>
            <tr>
                <th>From Node</th>
                <th>To Node</th>
            </tr>
        </thead>
        <tbody>
            {% for link in link_list %}
            <tr>
                <td>{{ link.from.name if link.from else 'Unknown' }}</td>
                <td>{{ link.to.name if link.to else 'Unknown' }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="2" class="text-muted text-center">No links found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
