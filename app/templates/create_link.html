{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header bg-white fw-bold">
                <i class="fas fa-link me-2 text-primary"></i>Create Node Link
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="from_node_id" class="form-label">From Node <span class="text-danger">*</span></label>
                        <select name="from_node_id" class="form-select" required>
                            <option value="">Select source node</option>
                            {% for node in nodes %}
                            <option value="{{ node.id }}">{{ node.name }} (ID: {{ node.id }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="to_node_id" class="form-label">To Node <span class="text-danger">*</span></label>
                        <select name="to_node_id" class="form-select" required>
                            <option value="">Select destination node</option>
                            {% for node in nodes %}
                            <option value="{{ node.id }}">{{ node.name }} (ID: {{ node.id }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Create Link</button>
                        <a href="{{ url_for('admin.list_links') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
