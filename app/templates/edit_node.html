{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header bg-white fw-bold">
                <i class="fas fa-edit me-2 text-warning"></i>Edit Node
            </div>
            <div class="card-body">
                <form method="POST">
                	<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" value="{{ node.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" name="description" class="form-control" value="{{ node.description }}">
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="x" class="form-label">X Position (0-100)</label>
                            <input type="number" name="x" class="form-control" min="0" max="100" step="0.1" value="{{ node.x }}">
                        </div>
                        <div class="col-md-6">
                            <label for="y" class="form-label">Y Position (0-100)</label>
                            <input type="number" name="y" class="form-control" min="0" max="100" step="0.1" value="{{ node.y }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="mines" class="form-label">Assigned Mines</label>
                        <select multiple name="mines" class="form-select" size="5">
                            {% for mine in mines %}
                            <option value="{{ mine.id }}" {% if mine.id in selected_ids %}selected{% endif %}>{{ mine.name }}</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">Hold Ctrl to select multiple</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update</button>
                        <a href="{{ url_for('admin.office') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
