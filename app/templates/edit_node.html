{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Edit Node</h2>
    <form method="POST">
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" class="form-control" value="{{ node.name }}" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <input type="text" name="description" class="form-control" value="{{ node.description }}">
        </div>
        <div class="form-group">
            <label>X Position (0-100)</label>
            <input type="number" name="x" class="form-control" min="0" max="100" step="0.1" value="{{ node.x }}">
        </div>
        <div class="form-group">
            <label>Y Position (0-100)</label>
            <input type="number" name="y" class="form-control" min="0" max="100" step="0.1" value="{{ node.y }}">
        </div>
        <div class="form-group">
            <label>Assigned Mines</label>
            <select multiple name="mines" class="form-control" size="5">
                {% for mine in mines %}
                <option value="{{ mine.id }}" {% if mine.id in selected_ids %}selected{% endif %}>{{ mine.name }}</option>
                {% endfor %}
            </select>
            <small class="text-muted">Hold Ctrl to select multiple</small>
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{{ url_for('admin.office') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
