{% extends "base.html" %}
{% block title %}Create Mine{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header bg-white fw-bold">
                <i class="fas fa-plus-circle me-2 text-primary"></i>Create New Mine
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="e.g., North Coal Mine">
                    </div>
                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" class="form-control" id="location" name="location" placeholder="City, State">
                    </div>
                    <div class="mb-3">
                        <label for="workers_count" class="form-label">Workers Count</label>
                        <input type="number" class="form-control" id="workers_count" name="workers_count" min="0" value="0">
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="x" class="form-label">X Position (0-100)</label>
                            <input type="number" name="x" class="form-control" min="0" max="100" step="0.1" placeholder="50">
                        </div>
                        <div class="col-md-6">
                            <label for="y" class="form-label">Y Position (0-100)</label>
                            <input type="number" name="y" class="form-control" min="0" max="100" step="0.1" placeholder="50">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Create</button>
                        <a href="{{ url_for('admin.office') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
