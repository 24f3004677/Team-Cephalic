{% extends "base.html" %}
{% block title %}Create Node{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header bg-white fw-bold">
                <i class="fas fa-plus-circle me-2 text-primary"></i>Create New Node
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Node Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" required placeholder="e.g., Sensor A1">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" class="form-control" id="description" name="description" placeholder="Optional details">
                    </div>
                    <div class="mb-3">
                        <label for="mines" class="form-label">Assign to Mines <span class="text-danger">*</span></label>
                        <select multiple class="form-select" id="mines" name="mines" required size="4">
                            {% for mine in mines %}
                            <option value="{{ mine.id }}">{{ mine.name }}</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">Hold Ctrl to select multiple</div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="x" class="form-label">X Position (0-100)</label>
                            <input type="number" name="x" class="form-control" min="0" max="100" step="0.1" placeholder="50">
                        </div>
                        <div class="col-md-6">
                            <label for="y" class="form-label">Y Position (0-100)</label>
                            <input type="number" name="y" class="form-control" min="0" max="100" step="0.1" placeholder="50">
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Create</button>
                        <a href="{{ url_for('admin.office') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
